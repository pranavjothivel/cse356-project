# Heavy LB TCP/IP stack tune (deployed to /etc/sysctl.d/99-lb-tune.conf
# on group1-lb-02 / 130.245.136.142 on 2026-05-07).
#
# Supersedes infra/lb-sysctl.conf for this box. Existing LB
# (group1-web-lb01) still runs the lighter tune from lb-sysctl.conf —
# do not blindly copy this file there without re-baselining.
#
# Box: 32 vCPU / 60 GB RAM, kernel 5.15. BBR + fq verified available.
# Apply: scp → /etc/sysctl.d/99-lb-tune.conf, then `sysctl --system`.
# Verify: sysctl <key>

# ---- File descriptors -------------------------------------------------
# HAProxy under load opens 4 sockets per request (client TLS + backend
# x2 retries + headroom). At 5K WS + bursty REST, default 1M fd is
# fine for the kernel; bump nr_open so per-process ulimit can grow.
fs.file-max = 2097152
fs.nr_open  = 2097152

# ---- Socket queues ----------------------------------------------------
# somaxconn: max pending accept() queue per listening socket. HAProxy
# `bind ... backlog 8192` is clamped by this. 65535 = headroom for
# autograder connect bursts past anything we have observed.
net.core.somaxconn           = 65535
# netdev_max_backlog: packets queued at NIC ring → softirq handoff.
# Default 1000 is undersized on a 32-vCPU box where multiple cores
# pull from the same NIC at line rate.
net.core.netdev_max_backlog  = 65535

# ---- Socket buffers ---------------------------------------------------
# 16 MiB max buffer per direction. Lets BDP * RTT auto-tune the window
# for the LAN backend hops (~0.3 ms RTT, fine) AND the WAN client hops
# (~80-120 ms RTT to East Coast graders) without bumping into a 4 MiB
# wmem cap.
net.core.rmem_default        = 262144
net.core.wmem_default        = 262144
net.core.rmem_max            = 16777216
net.core.wmem_max            = 16777216
net.core.optmem_max          = 65536

# ---- TCP autotune ranges (min default max) ----------------------------
# Default Ubuntu 22.04 caps wmem at 4 MiB. For TLS records on long-RTT
# paths the kernel keeps the cwnd small. Lifting to 16 MiB lets BBR
# expand without buffer pressure.
net.ipv4.tcp_rmem            = 4096 131072 16777216
net.ipv4.tcp_wmem            = 4096 65536  16777216
# tcp_mem: pages (4 KiB ea) of TCP-wide memory before pressure kicks
# in. 786432 / 1048576 / 26777216 pages ≈ 3 GiB / 4 GiB / 102 GiB —
# generous on a 60 GiB box but only used when many sockets buffer at
# once.
net.ipv4.tcp_mem             = 786432 1048576 26777216

# ---- Connection establishment ----------------------------------------
# SYN backlog must be >= somaxconn for kernel-side queueing. 65535
# matches; tcp_syncookies stays on as last-resort flood mitigation.
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_syncookies      = 1
# tcp_fastopen=3: enable TFO for both incoming AND outgoing. Saves an
# RTT on repeat-client handshakes if the autograder reuses TFO cookies.
net.ipv4.tcp_fastopen        = 3

# ---- Timers / TIME_WAIT ----------------------------------------------
# Shorter FIN_WAIT2 → frees sockets faster under churn. 15s is the
# common LB tune; 60s default is paranoid for healthy networks.
net.ipv4.tcp_fin_timeout     = 15
# tw_reuse=1: allow OUTBOUND reuse of TIME_WAIT sockets (we make many
# short-lived backend connects). =2 (current default on host) only
# enables for loopback. Force =1 explicitly.
net.ipv4.tcp_tw_reuse        = 1
# Bigger TW bucket pool — under 5K active WS + bursts of backend
# reconnects we can churn through TW sockets at >50K/min.
net.ipv4.tcp_max_tw_buckets  = 1440000
net.ipv4.tcp_max_orphans     = 262144
# Keepalive: the LB itself is mostly the passive end of WS, but for
# backend connections shorter probes detect dead app workers faster
# than the 2-hour default.
net.ipv4.tcp_keepalive_time   = 300
net.ipv4.tcp_keepalive_intvl  = 30
net.ipv4.tcp_keepalive_probes = 5

# ---- Ephemeral source ports ------------------------------------------
# Default 32768-60999 (~28K ports) is the bottleneck for outbound
# connects to backends after a TIME_WAIT spike. 10000-65535 ≈ 55K
# usable ports per (dst-IP, dst-port) tuple. Start at 10000 (not
# 1024) to keep room for any locally-bound service ports.
net.ipv4.ip_local_port_range = 10000 65535

# ---- Performance tweaks ----------------------------------------------
# Don't reset cwnd to initial value after idle. For HTTP/2 keepalive
# connections that sit idle then burst, this is a big win.
net.ipv4.tcp_slow_start_after_idle = 0
# Don't cache route metrics — past loss on one connection should not
# punish a fresh one with a smaller initial cwnd.
net.ipv4.tcp_no_metrics_save       = 1
# MTU probing: detect broken middleboxes that drop ICMP frag-needed
# without freezing the connection (=1 = enable when ICMP black hole
# detected).
net.ipv4.tcp_mtu_probing           = 1

# ---- Congestion control ----------------------------------------------
# BBR + fq: Google's bandwidth-delay-product based CC. Verified
# tcp_bbr module loadable on this kernel (5.15.0-92-generic). fq is
# REQUIRED as the qdisc for BBR's pacing to work; default fq_codel
# would silently fall back to a cubic-style send pattern.
# Roll back: set tcp_congestion_control=cubic and qdisc=fq_codel.
net.core.default_qdisc        = fq
net.ipv4.tcp_congestion_control = bbr

# ---- VM ---------------------------------------------------------------
# Discourage swapping. Box has 60 GiB RAM and no swap configured, but
# set defensively in case swap is added later.
vm.swappiness = 10
