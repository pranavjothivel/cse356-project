# LB sysctl tune (deployed to /etc/sysctl.d/99-lb-tune.conf on 130.245.136.254)
#
# Default `tcp_max_syn_backlog = 2048` was overflowing under grader connect
# storms. Symptom: scripts/tls-probe measured ~1% of TCP connects taking
# 1030-1075ms (Linux default initial RTO) — classic SYN-drop + retransmit.
#
# Applied 2026-05-06 ~02:35 UTC. Verify on box with:
#   sysctl net.ipv4.tcp_max_syn_backlog net.core.somaxconn
#
# To re-apply manually after a fresh provision:
#   scp this file to /etc/sysctl.d/99-lb-tune.conf, then `sysctl --system`
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn           = 8192
