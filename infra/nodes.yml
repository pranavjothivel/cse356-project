app_nodes:
  # API-only nodes — no WS server, no Redis pub/sub subscriber. Saves the
  # cost of every WS broadcast event (~180KB at p99) being deserialized and
  # iterated by an empty local users Map.
  - name: group1-api-node-01
    ip: 130.245.136.217
    private_ip: 10.0.3.93
    type: 8vcpu-16gb
    api_only: true
  - name: group1-api-node-02
    ip: 130.245.136.149
    private_ip: 10.0.1.121
    type: 8vcpu-16gb
    api_only: true
  - name: group1-api-node-03
    ip: 130.245.136.239
    private_ip: 10.0.0.177
    type: 8vcpu-16gb
    # Resized 2026-05-05 from 2vcpu-4gb. All 3 API nodes are now uniform.
    api_only: true
  - name: group1-api-node-http-01
    ip: 130.245.136.221
    private_ip: 10.0.1.119
    type: 8vcpu-16gb
    # Added to increase HTTP API worker capacity. No WS role; WORKER_ROLE=http
    # skips WS init, so this node never appears in app_ws_servers.
    api_only: true
  # Original 4-node WS pool (04/05/06/07) — REMOVED from rotation 2026-05-08
  # during the uWebSockets.js rewrite. These nodes run Ubuntu 22.04 (glibc
  # 2.35) and the uws prebuilt binary is built against newer glibc; they
  # can't load the rewritten WS layer. Commented out (not deleted) per
  # comment-don't-delete convention so the IPs are recoverable if we resize
  # them or rebuild on 24.04. The replacement uws pool is the lettered set
  # (04b/05a/06a/07a) below.
  # - name: group1-api-node-04
  #   ip: 130.245.136.223
  #   private_ip: 10.0.3.44
  #   type: 8vcpu-16gb
  #   ws_only: true
  # - name: group1-api-node-05
  #   ip: 130.245.136.72
  #   private_ip: 10.0.3.79
  #   type: 8vcpu-16gb
  #   ws_only: true
  # - name: group1-api-node-06
  #   ip: 130.245.136.112
  #   private_ip: 10.0.3.32
  #   type: 8vcpu-16gb
  #   ws_only: true
  # - name: group1-api-node-07
  #   ip: 130.245.136.53
  #   private_ip: 10.0.2.10
  #   type: 8vcpu-16gb
  #   ws_only: true
  # WS pool extension added 2026-05-08. Originally provisioned during the
  # 2026-05-06 24.04 ultimate-ws spike and parked as orphans; bringing them
  # in to double WS capacity (4 → 8 nodes). Ubuntu 24.04 (the others are
  # 22.04) but app stack has no glibc-sensitive native deps. Each starts
  # `disabled` in haproxy.cfg / haproxy-lb02.cfg until the first rolling
  # deploy lands code and the re-enable step flips them to ready.
  - name: group1-api-node-04b
    ip: 130.245.136.230
    private_ip: 10.0.2.240
    type: 8vcpu-16gb
    ws_only: true
  - name: group1-api-node-05a
    ip: 130.245.136.85
    private_ip: 10.0.0.7
    type: 8vcpu-16gb
    ws_only: true
  - name: group1-api-node-06a
    ip: 130.245.136.220
    private_ip: 10.0.1.133
    type: 8vcpu-16gb
    ws_only: true
  - name: group1-api-node-07a
    ip: 130.245.136.79
    private_ip: 10.0.1.4
    type: 8vcpu-16gb
    ws_only: true

lb_node: 130.245.136.254
# Second active LB provisioned 2026-05-07 (group1-lb-02). 32 vCPU / 60 GB,
# Ubuntu 22.04, BBR + heavy TCP tune (see infra/lb-sysctl-heavy.conf).
# Identical HAProxy 2.4.30 config + same Let's Encrypt cert; Nginx serves the
# same SPA bundle and proxies /minio/ → 10.0.1.28:9000 on lb01 (no local
# MinIO). The deploy pipeline currently pushes app/frontend/haproxy/nginx
# only to lb_node above; lb02 must be updated out-of-band until the pipeline
# is taught to fan out (see infra/README "Deploying to both LBs").
# lb_node_secondary: 130.245.136.142  # private 10.0.0.97 (group1-lb-02)
telemetry_node: 130.245.136.96
