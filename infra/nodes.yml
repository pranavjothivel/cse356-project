app_nodes:
  # API-only nodes — no WS server, no Redis pub/sub subscriber. Saves the
  # cost of every WS broadcast event (~180KB at p99) being deserialized and
  # iterated by an empty local users Map.
  - name: group1-api-node-01
    ip: 130.245.136.217
    private_ip: 10.0.3.93
    type: 8vcpu-16gb
    api_only: true
  - name: group1-api-node-02
    ip: 130.245.136.149
    private_ip: 10.0.1.121
    type: 8vcpu-16gb
    api_only: true
  - name: group1-api-node-03
    ip: 130.245.136.239
    private_ip: 10.0.0.177
    type: 2vcpu-4gb
    api_only: true
  - name: group1-api-node-04
    ip: 130.245.136.223
    private_ip: 10.0.3.44
    type: 4vcpu-8gb
    # Resized 2026-05-05 from 2vcpu-4gb and reassigned to WebSocket pool
    # alongside node-05 to eliminate the WS SPOF. Same WORKER_ROLE=ws flag
    # mechanics — deploy pipeline injects it via .env.
    ws_only: true
  - name: group1-api-node-05
    ip: 130.245.136.72
    private_ip: 10.0.3.79
    type: 8vcpu-16gb
    # Pinned to handle WebSocket traffic. HAProxy routes WS upgrades to the
    # app_ws_servers backend (node-04 + node-05). Setting this flag makes
    # the deploy pipeline inject WORKER_ROLE=ws into this node's .env, which
    # causes app.js to skip mounting /api/* routes.
    ws_only: true

lb_node: 130.245.136.254
telemetry_node: 130.245.136.96
