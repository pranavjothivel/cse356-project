app_nodes:
  # API-only nodes — no WS server, no Redis pub/sub subscriber. Saves the
  # cost of every WS broadcast event (~180KB at p99) being deserialized and
  # iterated by an empty local users Map.
  - name: group1-api-node-01
    ip: 130.245.136.217
    private_ip: 10.0.3.93
    type: 8vcpu-16gb
    api_only: true
  - name: group1-api-node-02
    ip: 130.245.136.149
    private_ip: 10.0.1.121
    type: 8vcpu-16gb
    api_only: true
  - name: group1-api-node-03
    ip: 130.245.136.239
    private_ip: 10.0.0.177
    type: 8vcpu-16gb
    # Resized 2026-05-05 from 2vcpu-4gb. All 3 API nodes are now uniform.
    api_only: true
  # 4-node WS pool (04/05/06/07). HAProxy app_ws_servers backend routes
  # WS upgrades here; deploy pipeline injects WORKER_ROLE=ws so app.js
  # skips /api mounts on these nodes.
  - name: group1-api-node-04
    ip: 130.245.136.223
    private_ip: 10.0.3.44
    type: 8vcpu-16gb
    ws_only: true
  - name: group1-api-node-05
    ip: 130.245.136.72
    private_ip: 10.0.3.79
    type: 8vcpu-16gb
    ws_only: true
  - name: group1-api-node-06
    ip: 130.245.136.112
    private_ip: 10.0.3.32
    type: 8vcpu-16gb
    ws_only: true
  - name: group1-api-node-07
    ip: 130.245.136.53
    private_ip: 10.0.2.10
    type: 8vcpu-16gb
    ws_only: true
  # WS pool extension parked 2026-05-08. Brought in to double WS capacity
  # (4 → 8 nodes) but doubling the redis-02 subscriber count doubled
  # per-publish fanout work and saturated the single-threaded Redis —
  # subscribers fell minutes behind, self-echo latency went to seconds.
  # Stopped via `pm2 stop cse356` on each box. Commented out here so the
  # deploy pipeline skips them; haproxy.cfg / haproxy-lb02.cfg keep
  # node8-11 entries `disabled` so the names remain configured. To bring
  # back: shrink the ~180KB-per-fanout payload (or shard pubsub) first,
  # uncomment, and remove `disabled` from both haproxy variants together.
