# Drop this into /etc/nginx/sites-available/ on the LB node (group1-web-lb01)
# and symlink to sites-enabled/. Adjust server_name and app node IP as needed.

upstream api {
    server 130.245.136.217:3000;
}

server {
    listen 80;
    server_name group1.cse356.compas.cs.stonybrook.edu;

    # Serve built frontend
    root /srv/frontend/dist;
    index index.html;

    # Proxy /uploads directly from the app node — bypasses Node for static file serving
    location /uploads/ {
        proxy_pass http://api/uploads/;
        proxy_cache_bypass 1;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy all API and WebSocket traffic to the app node
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — send everything else to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
