[databases]
; Templated at deploy time — PG_HOST and PG_DBNAME are replaced from PG_DIRECT_URL
* = host=PG_HOST_PLACEHOLDER port=5432 dbname=PG_DBNAME_PLACEHOLDER

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
user = postgres
pidfile = /var/run/postgresql/pgbouncer.pid
