[databases]
; Templated at deploy time — PG_HOST and PG_DBNAME are replaced from PG_DIRECT_URL.
;
; connect_query enforces statement_timeout on every backend connection. Verified
; empirically: with `server_reset_query = DISCARD ALL`, PgBouncer still presents
; statement_timeout=10s on every transaction handed to a client (it re-applies
; connect_query after the reset, or DISCARD doesn't unset connect_query-applied
; GUCs — either way the test shows 10s on tx1, tx2, tx3 of a single client).
;
; Why not just rely on the pg client's `statement_timeout` startup param? Because
; `ignore_startup_parameters` literally *ignores* the param — pgbouncer accepts
; the connection but drops the value. connect_query is the only path that
; actually applies the setting to the backend session.
* = host=PG_HOST_PLACEHOLDER port=5432 dbname=PG_DBNAME_PLACEHOLDER connect_query='SET statement_timeout = 10000'

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits, statement_timeout
log_connections = 0
log_disconnections = 0
user = postgres
pidfile = /var/run/postgresql/pgbouncer.pid
