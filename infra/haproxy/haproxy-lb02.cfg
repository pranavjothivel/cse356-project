global
    log 10.0.0.235:51400 local0
    maxconn 32768
    nbthread 16
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048
    tune.ssl.cachesize 100000
    tune.ssl.lifetime 3600
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    mode    http
    option  forwardfor
    timeout connect 1s
    timeout client  50s
    timeout server  50s
    timeout tunnel  3600s
    timeout http-keep-alive 600s
    option  redispatch
    retry-on all-retryable-errors 503

# lb02-specific divergence from infra/haproxy/haproxy.cfg:
# Plain HTTP on :80 is served instead of being 301-redirected to HTTPS.
# Same ACLs / backend routing as the TLS frontend, just no encryption.
# Useful for direct-IP testing and any client that cannot terminate TLS.
# X-Forwarded-Proto is set to "http" so the app can tell the difference.
frontend http_front
    bind *:80 backlog 8192
    # Abuse source observed flooding /api/* — added on lb02 prior to merge.
    tcp-request connection reject if { src 142.93.59.58 }
    log     global
    option  httplog

    unique-id-format %[uuid()]
    unique-id-header X-Request-ID

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Real-IP %[src]

    acl is_api  path_beg /api
    acl is_ws   hdr(Upgrade) -i websocket

    use_backend app_ws_servers if is_ws
    use_backend app_servers    if is_api
    default_backend static_files

frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/group1.cse356.compas.cs.stonybrook.edu.pem alpn h2,http/1.1 backlog 8192
    tcp-request connection reject if { src 142.93.59.58 }
    log     global
    option  httplog

    unique-id-format %[uuid()]
    unique-id-header X-Request-ID

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]

    acl is_api  path_beg /api
    acl is_ws   hdr(Upgrade) -i websocket

    use_backend app_ws_servers if is_ws
    use_backend app_servers    if is_api
    default_backend static_files

backend app_servers
    balance leastconn
    option httpchk GET /
    http-reuse safe

    http-response set-header X-Served-By %[srv_name]

    server node1 10.0.3.93:3000 check inter 3s fall 5 rise 2 weight 8
    server node2 10.0.1.121:3000 check inter 3s fall 5 rise 2 weight 8
    server node3 10.0.0.177:3000 check inter 3s fall 5 rise 2 weight 8
    # node-http-01: dedicated HTTP-only API worker (no WS).
    server node-http-01 10.0.1.119:3000 check inter 3s fall 5 rise 2 weight 8

backend app_ws_servers
    balance leastconn
    option httpchk GET /
    http-reuse safe
    timeout tunnel 3600s

    http-response set-header X-Served-By %[srv_name]

    # uWebSockets.js pool — see haproxy.cfg for full context. Original
    # 04/05/06/07 removed 2026-05-08 (Ubuntu 22.04 can't load uws prebuilt).
    # - server node4 10.0.3.44:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    # - server node5 10.0.3.79:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    # - server node6 10.0.3.32:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    # - server node7 10.0.2.10:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    # Pool extension added 2026-05-08 — must mirror infra/haproxy/haproxy.cfg.
    # uws-pool: WS traffic to :3001, health check on :3000 (Express). See the
    # equivalent block in haproxy.cfg for full context — including why
    # `disabled` is deliberately omitted (deploy-lb-configs reload wipes
    # runtime state).
    server node8  10.0.2.240:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    server node9  10.0.0.7:3001   check port 3000 inter 3s fall 5 rise 2 weight 8
    server node10 10.0.1.133:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    server node11 10.0.1.4:3001   check port 3000 inter 3s fall 5 rise 2 weight 8

backend static_files
    server nginx 127.0.0.1:8080

frontend stats
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    no log
