global
    log /dev/log local0
    maxconn 8192
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel  3600s

frontend http_front
    bind *:80
    redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/group1.cse356.compas.cs.stonybrook.edu.pem

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]

    acl is_api  path_beg /api
    acl is_ws   path_beg /ws

    use_backend app_servers if is_api or is_ws
    default_backend static_files

backend app_servers
    balance roundrobin
    option httpchk GET /

    http-response set-header X-Served-By %[srv_name]

    server node1 10.0.3.93:3000 check
    server node2 10.0.1.121:3000 check

backend static_files
    server nginx 127.0.0.1:8080
