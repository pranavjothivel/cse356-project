global
    log 10.0.0.235:51400 local0
    maxconn 8192
    ssl-default-bind-options ssl-min-ver TLSv1.2
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel  3600s

frontend http_front
    bind *:80
    redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/group1.cse356.compas.cs.stonybrook.edu.pem

    unique-id-format %[uuid()]
    unique-id-header X-Request-ID

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]

    acl is_api  path_beg /api
    acl is_ws   path_beg /ws

    use_backend app_servers if is_api or is_ws
    default_backend static_files

backend app_servers
    balance leastconn
    option httpchk GET /

    http-response set-header X-Served-By %[srv_name]

    server node1 10.0.3.93:3000 check weight 2
    server node2 10.0.1.121:3000 check weight 2
    server node3 10.0.0.177:3000 check weight 2
    server node4 10.0.3.44:3000 check weight 1

backend static_files
    server nginx 127.0.0.1:8080

frontend stats
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    no log
