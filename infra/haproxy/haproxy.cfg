global
    log 10.0.0.235:51400 local0
    # maxconn raised 8192 → 32768 to give headroom past the 1.6K observed peak
    # toward the 3K+ range top groups hit. With ~5K WS + concurrent REST under
    # autograder burst, 8192 was getting close enough to merit raising. No
    # per-server maxconn is set, so backends remain uncapped and balance via
    # leastconn. See docs/peak-capacity-2026-05-04.md.
    maxconn 32768
    # nbthread = vCPU count. LB resized 2026-05-04 from 4 vCPU → 16 vCPU
    # (Dedicated 30 GB plan). Without raising nbthread, HAProxy stays
    # capped at 4 worker threads and the resize buys nothing.
    nbthread 16
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048
    tune.ssl.cachesize 100000
    # Bump 600s → 3600s to maximize TLS session resumption. If the autograder
    # client opens fresh connections per delivery test, a longer ticket
    # lifetime keeps repeat handshakes on the 0-RTT resumption fast-path.
    tune.ssl.lifetime 3600
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    # 5s → 1s on 2026-05-06. Backend connect on a healthy LAN node is sub-ms;
    # 1s is ~1000× normal so no false-positives on legit slow accepts. This
    # compresses the 13.8s "double-redispatch" tail observed under autograder
    # load (5s connect-timeout + 5s connect-timeout + ~3.8s handler) to roughly
    # 1+1+~3.8 ≈ 5.8s. `option redispatch + retry-on all-retryable-errors 503`
    # below already handles the failover; this just makes failover faster when
    # a backend worker is mid-stall.
    timeout connect 1s
    timeout client  50s
    timeout server  50s
    timeout tunnel  3600s
    # Keep idle keep-alive TLS connections warm for 10 min so users with bursty
    # message patterns do not pay a cold handshake on every gap. Default fallback
    # is timeout client (50s), which closes too fast for typical chat idleness.
    timeout http-keep-alive 600s
    # Allow HAProxy to retry a failed request against a different backend.
    # Specifically catches the deploy window where node-05 (WS-only) may
    # briefly receive an /api/* request and 503 it with Retry-After before
    # HAProxy's own routing config refreshes to exclude it from app_servers.
    option  redispatch
    retry-on all-retryable-errors 503

frontend http_front
    bind *:80 backlog 8192
    redirect scheme https code 301

frontend https_front
    # alpn h2,http/1.1: advertise HTTP/2 to clients via TLS ALPN. An HTTP/2-
    # aware client can multiplex many requests over a single TLS connection,
    # eliminating the per-request handshake jitter that pushed cold-connection
    # p99 from 638 → 1144 ms in our e2e test. Backend stays HTTP/1.1; HAProxy
    # translates between protocols (no app-side change needed).
    # backlog 8192: match the bumped somaxconn (see infra/lb-sysctl.conf).
    # Without this, HAProxy asks for backlog=maxconn(32768) and the kernel
    # clamps to somaxconn — but the listen socket remembers the cap from
    # *boot time*. Reload alone wouldn't be enough if somaxconn ever drops.
    bind *:443 ssl crt /etc/haproxy/certs/group1.cse356.compas.cs.stonybrook.edu.pem alpn h2,http/1.1 backlog 8192

    unique-id-format %[uuid()]
    unique-id-header X-Request-ID

    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]

    acl is_api  path_beg /api
    # WS upgrade detection by header, NOT path. The frontend connects to
    # `wss://.../api?token=X` (per VITE_WS_URL in deploy workflow), so the
    # path begins with /api — a `path_beg /ws` ACL would match zero real
    # WS traffic. The Upgrade header is the universal WS marker.
    acl is_ws   hdr(Upgrade) -i websocket

    # Order matters: is_ws is evaluated first so WS upgrade requests
    # (which match BOTH ACLs since their path is /api) route to the WS
    # backend instead of falling through to app_servers.
    use_backend app_ws_servers if is_ws
    use_backend app_servers    if is_api
    default_backend static_files

backend app_servers
    balance leastconn
    option httpchk GET /
    http-reuse safe
    fullconn 2048

    http-response set-header X-Served-By %[srv_name]

    # All 3 API nodes are 8 vCPU / 16 GB after the 2026-05-05 resize
    # (node-03 bumped from 2 vCPU). Equal weights → leastconn balances
    # purely by current connection count.
    server node1 10.0.3.93:3000 check inter 3s fall 5 rise 2 weight 8
    server node2 10.0.1.121:3000 check inter 3s fall 5 rise 2 weight 8
    server node3 10.0.0.177:3000 check inter 3s fall 5 rise 2 weight 8
    # node-04 + node-05 removed: pinned to WS via app_ws_servers below.
    # See infra/nodes.yml `ws_only: true` on those nodes — deploy pipeline
    # injects WORKER_ROLE=ws into their .env so app.js skips API mounts.

backend app_ws_servers
    # WebSocket pool. node-04 + node-05 are both 8 vCPU / 16 GB after the
    # 2026-05-05 resize, so equal weights now. leastconn keeps long-lived
    # WS connections balanced by current count.
    balance leastconn
    option httpchk GET /
    http-reuse safe
    timeout tunnel 3600s

    http-response set-header X-Served-By %[srv_name]

    server node4 10.0.3.44:3000 check inter 3s fall 5 rise 2 weight 8
    server node5 10.0.3.79:3000 check inter 3s fall 5 rise 2 weight 8
    server node6 10.0.3.32:3000 check inter 3s fall 5 rise 2 weight 8
    server node7 10.0.2.10:3000 check inter 3s fall 5 rise 2 weight 8
    # Pool extension added 2026-05-08 (formerly the 04b/05a/06a/07a orphans).
    # uws-pool: WS traffic goes to :3001 (uWebSockets.js listener) while the
    # health check hits :3000 (Express HTTP server) via `check port 3000`.
    # The app awaits uws bind on :3001 BEFORE Express listens on :3000, so a
    # successful `:3000 GET /` health check is itself a readiness signal that
    # :3001 is up — no race during startup.
    # See plan 2026-05-08 ws-uws-rewrite — these nodes run the rewritten code;
    # the original node4/5/6/7 above continue running the legacy ws-library
    # build on :3000 as the rollback path.
    # NOTE: deliberately omitting `disabled`. Per the 2026-05-08 04b/05a/06a/07a
    # incident, deploy-lb-configs reloads haproxy at the end of every deploy
    # which wipes runtime `state ready` overrides — servers shipped with
    # `disabled` revert to MAINT shortly after the per-node re-enable step
    # and silently stay out of rotation. The default `check inter 3s fall 5
    # rise 2` already holds new servers DOWN until 2 successful checks (~6s)
    # which is enough cushion if app code lags the LB reload. nodeN index
    # follows nodes.yml array order — keep these in sync.
    server node8  10.0.2.240:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    server node9  10.0.0.7:3001   check port 3000 inter 3s fall 5 rise 2 weight 8
    server node10 10.0.1.133:3001 check port 3000 inter 3s fall 5 rise 2 weight 8
    server node11 10.0.1.4:3001   check port 3000 inter 3s fall 5 rise 2 weight 8

backend static_files
    server nginx 127.0.0.1:8080

frontend stats
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    no log
