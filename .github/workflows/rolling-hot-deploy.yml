name: Rolling Hot Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deploy'
        required: false
        default: 'manual rolling deploy'
      drain_wait:
        description: 'Max seconds to wait for in-flight requests to drain (poll cap, not a fixed sleep)'
        required: false
        default: '180'
      target_node:
        description: 'Deploy to a single node only (1–4). Leave empty to roll all nodes.'
        required: false
        default: ''

jobs:
  setup:
    name: Read infra config
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.nodes.outputs.nodes }}
      lb: ${{ steps.nodes.outputs.lb }}
      telemetry: ${{ steps.nodes.outputs.telemetry }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Parse nodes
        id: nodes
        run: |
          nodes=$(yq -o=json '.app_nodes' infra/nodes.yml | tr -d '\n')
          lb=$(yq '.lb_node' infra/nodes.yml)

          # Annotate each node with its HAProxy server name and whether it is first
          nodes=$(echo "$nodes" | jq -c '[to_entries[] | .value + {
            ha_server: ("node" + ((.key + 1) | tostring)),
            is_first:  (.key == 0)
          }]')

          # Filter to a single node when target_node is specified
          target="${{ inputs.target_node }}"
          if [ -n "$target" ]; then
            idx=$(( target - 1 ))
            nodes=$(echo "$nodes" | jq -c --argjson idx "$idx" '[.[$idx] | .is_first = true]')
          fi

          telemetry=$(yq '.telemetry_node' infra/nodes.yml)
          echo "nodes=$nodes"         >> "$GITHUB_OUTPUT"
          echo "lb=$lb"               >> "$GITHUB_OUTPUT"
          echo "telemetry=$telemetry" >> "$GITHUB_OUTPUT"

  deploy-node:
    name: Deploy ${{ matrix.node.name }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        node: ${{ fromJSON(needs.setup.outputs.nodes) }}
    env:
      LB: ${{ needs.setup.outputs.lb }}
      DRAIN_WAIT: ${{ inputs.drain_wait }}
      NODE_NAME: ${{ matrix.node.name }}
      NODE_IP: ${{ matrix.node.ip }}
      HA_SERVER: ${{ matrix.node.ha_server }}
      # ws_only nodes live in the app_ws_servers backend, others in app_servers.
      # The drain/re-enable steps need this to target the right pool when
      # cycling a node — without it, drain commands silently no-op on the wrong
      # backend and WS connections get killed ungracefully on PM2 reload.
      HA_BACKEND: ${{ matrix.node.ws_only && 'app_ws_servers' || 'app_servers' }}
      SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Drain from HAProxy
        run: |
          # Run drain + poll inside a single SSH session on the LB. The LB's
          # sshd listen backlog is the openssh default of 128, and the LB's
          # HAProxy threads run hot under load; that combo causes intermittent
          # SYN-queue overflow → kernel RST → "Connection reset by peer" on
          # ssh root@LB. Retry up to 5 times with backoff to ride those out.
          echo "Draining $HA_BACKEND/$HA_SERVER (cap ${DRAIN_WAIT}s, exit early on scur≤5 or scur stable for 3 polls)..."
          SCRIPT=$(cat <<'REMOTE'
          set -eu
          HA="$1"; CAP="$2"; BACKEND="$3"
          sock=/run/haproxy/admin.sock
          echo "set server $BACKEND/$HA state drain" | socat stdio "$sock"
          deadline=$(( $(date +%s) + CAP ))
          prev=-1
          stable=0
          while :; do
            scur=$(echo 'show stat' | socat stdio "$sock" \
              | awk -F, -v s="$HA" -v b="$BACKEND" '$1==b && $2==s {print $5; exit}')
            scur=${scur:-0}
            now=$(date +%s)
            echo "  scur=$scur (deadline in $(( deadline - now ))s)"
            if [ "$scur" -le 5 ]; then
              echo "Drained ($scur active sessions)."
              exit 0
            fi
            if [ "$scur" -eq "$prev" ]; then
              stable=$(( stable + 1 ))
              if [ "$stable" -ge 3 ]; then
                echo "scur stable at $scur for 3 polls — likely persistent /ws connections; proceeding."
                exit 0
              fi
            else
              stable=0
            fi
            if [ "$now" -ge "$deadline" ]; then
              echo "::warning::Drain cap reached with scur=$scur — proceeding anyway"
              exit 0
            fi
            prev=$scur
            sleep 2
          done
          REMOTE
          )
          for attempt in 1 2 3 4 5; do
            if $SSH -o ConnectTimeout=10 root@$LB "bash -s '$HA_SERVER' '$DRAIN_WAIT' '$HA_BACKEND'" <<<"$SCRIPT"; then
              exit 0
            fi
            echo "::warning::ssh root@LB drain failed (attempt $attempt/5) — retrying in 5s..."
            sleep 5
          done
          echo "::error::ssh root@LB drain failed after 5 attempts"
          exit 1

      - name: Snapshot for rollback
        if: ${{ matrix.node.is_first }}
        run: |
          echo "Snapshotting $NODE_NAME → runner for rollback..."
          mkdir -p /tmp/app-backup
          rsync -az --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            deploy@$NODE_IP:/srv/app/ /tmp/app-backup/

      - name: Sync code
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # 5-attempt retry to ride the recurring `kex_exchange_identification:
          # Connection reset by peer` from app-node sshd under autograder load.
          # Same shape as the LB drain/re-enable retry at the top of this job.
          with_retry() {
            local desc="$1"; shift
            local n=0
            while [ $n -lt 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "::warning::$desc failed (attempt $n/5) — retrying in 5s..." >&2
              sleep 5
            done
            echo "::error::$desc failed after 5 attempts" >&2
            return 1
          }

          push_env() {
            # Per-node WORKER_ROLE based on flags in nodes.yml:
            #   ws_only:true  → WORKER_ROLE=ws   (skip API mounts)
            #   api_only:true → WORKER_ROLE=http (skip WS server + Redis subscribe)
            #   neither       → WORKER_ROLE=all  (legacy / dev / mixed nodes)
            # Avoiding 'all' on dedicated API nodes saves ~50% of pub/sub
            # subscriber bandwidth (no idle Redis subscribers receiving the
            # ~180KB recipient-list payload at p99 just to discard it locally).
            worker_role="all"
            if [ "${{ matrix.node.ws_only }}" = "true" ]; then worker_role="ws"; fi
            if [ "${{ matrix.node.api_only }}" = "true" ]; then worker_role="http"; fi
            printf '%s\nWORKER_ROLE=%s\n' "$ENV_FILE" "$worker_role" | \
              $SSH deploy@$NODE_IP "mkdir -p /srv/app && cat > /srv/app/.env"
          }
          rsync_code() {
            rsync -az --delete \
              --exclude='.env' --exclude='node_modules/' \
              -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
              ./server/ deploy@$NODE_IP:/srv/app/
          }

          echo "Syncing code to $NODE_NAME..."
          with_retry "env push to $NODE_NAME" push_env
          with_retry "rsync code to $NODE_NAME" rsync_code

      - name: Snapshot PgBouncer config
        id: pgbouncer-snapshot
        if: ${{ matrix.node.is_first }}
        run: |
          set -euo pipefail
          with_retry() {
            local desc="$1"; shift; local n=0
            while [ $n -lt 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "::warning::$desc failed (attempt $n/5) — retrying in 5s..." >&2
              sleep 5
            done
            echo "::error::$desc failed after 5 attempts" >&2; return 1
          }
          scp_snapshot() {
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes \
              root@$NODE_IP:/etc/pgbouncer/pgbouncer.ini /tmp/pgbouncer-backup/pgbouncer.ini
          }
          echo "Snapshotting /etc/pgbouncer/pgbouncer.ini from $NODE_NAME → runner..."
          mkdir -p /tmp/pgbouncer-backup
          with_retry "scp pgbouncer.ini from $NODE_NAME" scp_snapshot
          # Sanity: file exists and is non-empty before we proceed.
          test -s /tmp/pgbouncer-backup/pgbouncer.ini
          echo "Snapshot OK ($(wc -c </tmp/pgbouncer-backup/pgbouncer.ini) bytes)"

      - name: Configure PgBouncer
        run: |
          # Moved before Install deps and reload PM2 so the app reloads against
          # the new pgbouncer config (e.g. ignore_startup_parameters changes).
          # Otherwise: chicken-and-egg, app crashes on connect because the old
          # pgbouncer rejects the new startup params.
          with_retry() {
            local desc="$1"; shift; local n=0
            while [ $n -lt 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "::warning::$desc failed (attempt $n/5) — retrying in 5s..." >&2
              sleep 5
            done
            echo "::error::$desc failed after 5 attempts" >&2; return 1
          }

          mk_pgbouncer_dir() { $SSH deploy@$NODE_IP "mkdir -p /srv/app/infra/pgbouncer"; }
          rsync_pgbouncer() {
            rsync -az \
              -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
              ./infra/pgbouncer/ deploy@$NODE_IP:/srv/app/infra/pgbouncer/
          }
          apply_pgbouncer() {
            $SSH root@$NODE_IP bash <<'PGBOUNCER'
              set -euo pipefail
              source /srv/app/.env
              PG_HOST=$(echo "$PG_DIRECT_URL" | sed -n 's|.*@\([^:/]*\).*|\1|p')
              PG_DBNAME=$(echo "$PG_DIRECT_URL" | sed -n 's|.*/\([^?]*\).*|\1|p')
              PG_USER=$(echo "$PG_DIRECT_URL" | sed -n 's|.*://\([^:]*\):.*|\1|p')
              PG_PASS=$(echo "$PG_DIRECT_URL" | sed -n 's|.*://[^:]*:\([^@]*\)@.*|\1|p')

              sed -e "s|PG_HOST_PLACEHOLDER|$PG_HOST|" \
                  -e "s|PG_DBNAME_PLACEHOLDER|$PG_DBNAME|" \
                  /srv/app/infra/pgbouncer/pgbouncer.ini \
                  > /etc/pgbouncer/pgbouncer.ini

              echo "\"$PG_USER\" \"$PG_PASS\"" > /etc/pgbouncer/userlist.txt
              chmod 640 /etc/pgbouncer/userlist.txt
              chown postgres:postgres /etc/pgbouncer/userlist.txt /etc/pgbouncer/pgbouncer.ini

              systemctl reload pgbouncer || systemctl restart pgbouncer
          PGBOUNCER
          }

          with_retry "ssh mkdir pgbouncer dir on $NODE_NAME" mk_pgbouncer_dir
          with_retry "rsync pgbouncer config to $NODE_NAME" rsync_pgbouncer
          with_retry "ssh apply pgbouncer config on $NODE_NAME" apply_pgbouncer

      - name: Install deps and reload PM2
        run: |
          with_retry() {
            local desc="$1"; shift; local n=0
            while [ $n -lt 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "::warning::$desc failed (attempt $n/5) — retrying in 5s..." >&2
              sleep 5
            done
            echo "::error::$desc failed after 5 attempts" >&2; return 1
          }

          # Record error log offset before reload so the PM2 status check only
          # shows lines written by the new process, not leftover history.
          read_offset() {
            $SSH root@$NODE_IP 'cat /var/log/pm2/cse356-error.log 2>/dev/null | wc -c' \
              > /tmp/pm2-err-offset
          }
          install_and_reload() {
            $SSH deploy@$NODE_IP bash <<'REMOTE'
              set -euo pipefail
              export PATH="$PATH:/usr/local/bin"
              cd /srv/app
              mkdir -p /srv/app/uploads
              npm install --omit=dev --prefer-offline
              if pm2 describe cse356 > /dev/null 2>&1; then
                pm2 reload ecosystem.config.js --update-env
              else
                pm2 start ecosystem.config.js
              fi
              _out=$(pm2 scale cse356 $(nproc) 2>&1) && echo "$_out" \
                || { echo "$_out" | grep -q "Nothing to do" \
                  && echo "pm2: already at $(nproc) instances, skipping scale" \
                  || { echo "$_out" >&2; exit 1; }; }
              pm2 save
          REMOTE
          }

          with_retry "ssh read pm2 err offset on $NODE_NAME" read_offset
          with_retry "ssh install+reload pm2 on $NODE_NAME" install_and_reload

      - name: Health check
        run: |
          echo "Health-checking $NODE_NAME..."
          for attempt in $(seq 1 15); do
            if $SSH deploy@$NODE_IP 'curl -sf --max-time 3 http://localhost:3000/' > /dev/null 2>&1; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Health check failed for $NODE_NAME after 15 attempts"
              exit 1
            fi
            sleep 2
          done

      - name: PM2 status check
        id: pm2check
        if: always()
        run: |
          with_retry() {
            local desc="$1"; shift; local n=0
            while [ $n -lt 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "::warning::$desc failed (attempt $n/5) — retrying in 5s..." >&2
              sleep 5
            done
            echo "::error::$desc failed after 5 attempts" >&2; return 1
          }

          show_pm2_list() { $SSH root@$NODE_IP 'su -s /bin/bash deploy -c "pm2 list"'; }
          tail_errlog() {
            local offset=$1
            $SSH root@$NODE_IP "tail -c +$(( offset + 1 )) /var/log/pm2/cse356-error.log 2>/dev/null || true"
          }
          fetch_pm2_jlist() { $SSH root@$NODE_IP 'su -s /bin/bash deploy -c "pm2 jlist"'; }

          echo "PM2 status on $NODE_NAME:"
          with_retry "ssh pm2 list on $NODE_NAME" show_pm2_list
          offset=$(cat /tmp/pm2-err-offset 2>/dev/null || echo 0)
          echo "--- error log since reload (offset $offset) ---"
          with_retry "ssh tail err log on $NODE_NAME" tail_errlog "$offset"

          # Parse via jq on the runner (guaranteed available) rather than on the node.
          # Checks: at least one cse356 instance exists AND all are "online".
          # "launching" is intentionally treated as a failure — by the time this step
          # runs the health check has already passed, so all instances must have
          # settled. A "launching" here means something restarted unexpectedly.
          # Retry the jlist fetch — under autograder load the node's sshd accept
          # queue overflows; we don't want a transient kex reset to drive a
          # spurious has_error=true and trigger a rollback of a healthy node.
          pm2_json=""
          n=0
          while [ $n -lt 5 ]; do
            if pm2_json=$(fetch_pm2_jlist); then break; fi
            n=$((n+1))
            echo "::warning::ssh pm2 jlist on $NODE_NAME failed (attempt $n/5) — retrying in 5s..." >&2
            sleep 5
          done
          if [ -z "$pm2_json" ]; then
            echo "::error::pm2 jlist failed after 5 attempts; treating as has_error=true"
            echo "has_error=true" >> "$GITHUB_OUTPUT"
          elif echo "$pm2_json" | jq -e '
            [.[] | select(.name == "cse356")] | length > 0
            and all(.pm2_env.status == "online")
          ' > /dev/null; then
            echo "has_error=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_error=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rollback
        if: ${{ always() && matrix.node.is_first && steps.pm2check.outputs.has_error == 'true' }}
        run: |
          echo "::error::PM2 errored on $NODE_NAME — rolling back"
          rsync -az --delete --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            /tmp/app-backup/ deploy@$NODE_IP:/srv/app/
          $SSH deploy@$NODE_IP 'pm2 restart cse356'
          echo "::notice::Rollback successful on $NODE_NAME"

      - name: Rollback PgBouncer config
        # Restore /etc/pgbouncer/pgbouncer.ini from the snapshot taken before
        # Configure PgBouncer ran. Fires on ANY job-failure path (not only the
        # pm2check one) so a bad pgbouncer config that crashes the reload still
        # gets reverted. Guarded by snapshot.outcome == 'success' so we never
        # overwrite a known-good config with a missing/empty backup.
        if: ${{ failure() && matrix.node.is_first && steps.pgbouncer-snapshot.outcome == 'success' }}
        run: |
          set -euo pipefail
          echo "::error::Rolling back pgbouncer config on $NODE_NAME"
          test -s /tmp/pgbouncer-backup/pgbouncer.ini
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes \
            /tmp/pgbouncer-backup/pgbouncer.ini root@$NODE_IP:/tmp/pgbouncer.ini.rollback
          $SSH root@$NODE_IP 'set -eu; mv /tmp/pgbouncer.ini.rollback /etc/pgbouncer/pgbouncer.ini && chown postgres:postgres /etc/pgbouncer/pgbouncer.ini && (systemctl reload pgbouncer || systemctl restart pgbouncer)'
          echo "::notice::PgBouncer config rollback successful on $NODE_NAME"

      - name: Post-rollback health check
        if: ${{ always() && matrix.node.is_first && steps.pm2check.outputs.has_error == 'true' }}
        run: |
          echo "Health-checking $NODE_NAME after rollback..."
          for attempt in $(seq 1 15); do
            if $SSH deploy@$NODE_IP 'curl -sf --max-time 3 http://localhost:3000/' > /dev/null 2>&1; then
              echo "Post-rollback health check passed on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Post-rollback health check failed for $NODE_NAME — node may be stuck"
              exit 1
            fi
            sleep 2
          done

      - name: Post-rollback PM2 status check
        if: ${{ always() && matrix.node.is_first && steps.pm2check.outputs.has_error == 'true' }}
        run: |
          echo "PM2 status on $NODE_NAME after rollback:"
          $SSH root@$NODE_IP 'su -s /bin/bash deploy -c "pm2 list"'
          offset=$(cat /tmp/pm2-err-offset)
          echo "--- error log since reload (offset $offset) ---"
          $SSH root@$NODE_IP \
            "tail -c +$(( offset + 1 )) /var/log/pm2/cse356-error.log 2>/dev/null || true"

          # Same logic as the main PM2 check — all instances must be "online".
          # "launching" is a failure here too: the post-rollback health check already
          # ran and confirmed the app is (or isn't) serving, so instances must have settled.
          pm2_json=$($SSH root@$NODE_IP 'su -s /bin/bash deploy -c "pm2 jlist"')
          if ! echo "$pm2_json" | jq -e '
            [.[] | select(.name == "cse356")] | length > 0
            and all(.pm2_env.status == "online")
          ' > /dev/null; then
            echo "::error::PM2 still not fully online on $NODE_NAME after rollback"
            exit 1
          fi

      - name: Re-enable in HAProxy
        if: always()
        run: |
          echo "Re-enabling $HA_BACKEND/$HA_SERVER in HAProxy..."
          # Same retry as the drain step — the LB's sshd accept queue can
          # overflow under autograder load and produce a transient RST.
          for attempt in 1 2 3 4 5; do
            if $SSH -o ConnectTimeout=10 root@$LB \
                "echo 'set server $HA_BACKEND/$HA_SERVER state ready' | socat stdio /run/haproxy/admin.sock"; then
              exit 0
            fi
            echo "::warning::ssh root@LB re-enable failed (attempt $attempt/5) — retrying in 5s..."
            sleep 5
          done
          echo "::error::ssh root@LB re-enable failed after 5 attempts — node may be stranded in DRAIN!"
          exit 1

      - name: "[WARNING] Deploy failed — rollback applied"
        if: ${{ always() && steps.pm2check.outputs.has_error == 'true' }}
        run: |
          echo "::error::Deploy of branch '${{ github.ref_name }}' @ ${GITHUB_SHA:0:7} failed on $NODE_NAME — PM2 did not reach a healthy state."
          echo "::error::A rollback to the previous snapshot has been applied. Investigate the ref before re-deploying."
          exit 1

  deploy-jobs:
    name: Deploy cron jobs (telemetry)
    needs: setup
    runs-on: ubuntu-latest
    env:
      TELEMETRY: ${{ needs.setup.outputs.telemetry }}
      SSH: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Ensure /root/redis-cleanup exists
        run: $SSH root@$TELEMETRY 'mkdir -p /root/redis-cleanup'

      - name: Sync job files
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='output.txt' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes" \
            ./jobs/redis-cleanup/ root@$TELEMETRY:/root/redis-cleanup/

      - name: Push .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          grep '^REDIS_URL=' <(printf '%s' "$ENV_FILE") \
            | $SSH root@$TELEMETRY 'cat > /root/redis-cleanup/.env'

      - name: Install deps
        run: $SSH root@$TELEMETRY '. /root/.nvm/nvm.sh && cd /root/redis-cleanup && npm install --omit=dev --prefer-offline'

  deploy-frontend:
    name: Deploy frontend to LB
    needs: [setup, deploy-node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if frontend exists
        id: fe
        run: |
          [ -f client/package.json ] && echo "exists=true" >> "$GITHUB_OUTPUT" \
            || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        if: steps.fe.outputs.exists == 'true'
        working-directory: client
        env:
          VITE_BACKEND_URL: https://group1.cse356.compas.cs.stonybrook.edu/api
          VITE_WS_URL: wss://group1.cse356.compas.cs.stonybrook.edu/api
          VITE_IMAGE_URL: https://group1.cse356.compas.cs.stonybrook.edu/minio/images
        run: npm ci && npm run build

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy frontend to LB node
        if: steps.fe.outputs.exists == 'true'
        run: |
          # Retry: same LB-side accept-queue-overflow risk as the drain step.
          for attempt in 1 2 3 4 5; do
            if rsync -az --delete \
                -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10" \
                client/dist/ root@${{ needs.setup.outputs.lb }}:/srv/frontend/dist/; then
              exit 0
            fi
            echo "::warning::rsync to LB failed (attempt $attempt/5) — retrying in 5s..."
            sleep 5
          done
          echo "::error::rsync to LB failed after 5 attempts"
          exit 1

  deploy-lb-configs:
    name: Deploy LB configs (HAProxy + Nginx)
    # Must run after deploy-node to avoid a race: if HAProxy config is reloaded
    # while a node is drained (drain state is runtime-only, not in the config file),
    # the reload resets all servers to ready and sends traffic to a node mid-deploy.
    needs: [setup, deploy-node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for config changes
        id: changes
        run: |
          git fetch origin main
          base=$(git merge-base HEAD origin/main)
          haproxy=$(git diff --name-only "$base" HEAD -- infra/haproxy/haproxy.cfg | wc -l)
          nginx=$(git diff --name-only "$base" HEAD -- infra/nginx/ | wc -l)
          echo "haproxy=$( [ "$haproxy" -gt 0 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          echo "nginx=$( [ "$nginx" -gt 0 ] && echo true || echo false )"     >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        if: steps.changes.outputs.haproxy == 'true' || steps.changes.outputs.nginx == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Push HAProxy config
        if: steps.changes.outputs.haproxy == 'true'
        env:
          LB: ${{ needs.setup.outputs.lb }}
        run: |
          # Retry: same LB-side accept-queue-overflow risk as the drain step.
          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "::warning::$1 to LB failed (attempt $attempt/5) — retrying in 5s..."
              sleep 5
            done
            echo "::error::$1 to LB failed after 5 attempts"
            return 1
          }
          retry scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            infra/haproxy/haproxy.cfg root@$LB:/etc/haproxy/haproxy.cfg
          retry ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            root@$LB "haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy"

      - name: Push Nginx config
        if: steps.changes.outputs.nginx == 'true'
        env:
          LB: ${{ needs.setup.outputs.lb }}
        run: |
          retry() {
            for attempt in 1 2 3 4 5; do
              if "$@"; then return 0; fi
              echo "::warning::$1 to LB failed (attempt $attempt/5) — retrying in 5s..."
              sleep 5
            done
            echo "::error::$1 to LB failed after 5 attempts"
            return 1
          }
          retry scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            infra/nginx/nginx.conf root@$LB:/etc/nginx/nginx.conf
          retry rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10" \
            infra/nginx/sites-enabled/ root@$LB:/etc/nginx/sites-enabled/
          retry ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            root@$LB "nginx -t && systemctl reload nginx"
