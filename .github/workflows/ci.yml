name: CI

on:
  push:
    branches-ignore:
      - main
      - pranavjothivel/deployment-pipeline
  pull_request:
    branches:
      - main

jobs:
  client:
    name: Client build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      # - name: Lint
      #   working-directory: client
      #   run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build

